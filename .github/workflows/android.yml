name: Android APK
on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml', 'icon-512*.png']
  pull_request:
    paths: ['android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#7B5CFF' --splashBackgroundColor '#0B0A12'
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: InstaPulse-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
